<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>电路基板进销存系统</title>
  <link rel="stylesheet" href="/css/style.css">
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%233B82F6'/%3E%3Cpath d='M8 10h6v12H8zm10-4h6v16h-6z' fill='%23fff'/%3E%3C/svg%3E">
</head>
<body>

  <!-- ============ 登录页 ============ -->
  <div id="loginPage" class="login-page">
    <div class="login-card">
      <div class="login-header">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24"><path d="M3 13h1v7c0 1.103.897 2 2 2h12c1.103 0 2-.897 2-2v-7h1a1 1 0 0 0 .707-1.707l-9-9a.999.999 0 0 0-1.414 0l-9 9A1 1 0 0 0 3 13zm7 7v-5h4v5h-4zm2-15.586 6 6V20h-3v-5c0-1.103-.897-2-2-2h-4c-1.103 0-2 .897-2 2v5H6v-8.586l6-6z"/></svg>
        </div>
        <h2>电路基板进销存系统</h2>
        <p>Circuit Board Inventory Management</p>
      </div>
      <form id="loginForm" class="login-form">
        <div class="form-group">
          <label for="loginUsername">用户名</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-7 8-7s8 3 8 7"/></svg>
            <input type="text" id="loginUsername" placeholder="请输入用户名" required autocomplete="username">
          </div>
        </div>
        <div class="form-group">
          <label for="loginPassword">密码</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="loginPassword" placeholder="请输入密码" required autocomplete="current-password">
          </div>
        </div>
        <div class="form-error" id="loginError"></div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="loginBtn">
          <span id="loginBtnText">登 录</span>
        </button>
      </form>
    </div>
  </div>

  <!-- ============ 主应用 ============ -->
  <div id="app" class="app" style="display:none">
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        </div>
        <span class="brand-text">进销存系统</span>
      </div>
      <nav class="sidebar-nav" id="sidebarNav">
        <!-- 由 app.js 动态渲染 -->
      </nav>
      <div class="sidebar-footer">
        <span>v1.0.0</span>
      </div>
    </aside>

    <!-- 主区域 -->
    <div class="main-area">
      <header class="topbar">
        <button class="sidebar-toggle" id="sidebarToggle" title="收起/展开菜单">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="topbar-title" id="pageTitle">仪表盘</div>
        <div class="topbar-right">
          <span class="user-info" id="userInfo"></span>
          <div class="user-avatar" id="userAvatar"></div>
          <button class="btn btn-ghost btn-sm" id="logoutBtn">退出</button>
        </div>
      </header>

      <main class="content" id="contentArea">
        <!-- 页面内容由 app.js 动态渲染 -->
      </main>
    </div>
  </div>

  <!-- Toast 容器 -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- 通用弹窗 -->
  <div class="modal-overlay" id="modalOverlay" style="display:none">
    <div class="modal" id="modalBox">
      <div class="modal-header">
        <h3 id="modalTitle"></h3>
        <button class="modal-close" id="modalClose">&#10005;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer" id="modalFooter"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
